[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system1bench"
version = "0.2.0"
description = "Reproducible, provenance-aware evaluation of typed decision models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15", "huggingface-hub>=0.24", "PyYAML>=6"]

[project.optional-dependencies]
laya = ["laya==0.3.20"]
llm = ["torch==2.7.1", "transformers==5.16.1"]

[tool.setuptools.packages.find]
include = ["system1bench*"]

[tool.ruff.lint]
select = ["E9", "F"]
