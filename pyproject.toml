[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system1bench"
version = "0.2.0"
description = "Reproducible, provenance-aware evaluation of typed decision models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15", "huggingface-hub>=0.24", "PyYAML>=6", "requests>=2.32"]

[project.optional-dependencies]
paper = ["matplotlib==3.10.8", "scipy>=1.11"]
laya = ["laya==0.3.20"]
llm = ["torch==2.7.1", "transformers==5.16.1"]
decision = ["torch==2.7.1", "transformers==5.17.0", "peft==0.21.0", "pydantic==2.13.5", "accelerate>=1"]

[tool.setuptools.packages.find]
include = ["system1bench*"]

[tool.ruff.lint]
select = ["E9", "F"]

# These immutable research scripts are hash-bound in published experiment
# manifests. Preserve their measured source bytes; unused imports are harmless.
[tool.ruff.lint.per-file-ignores]
"research/batch_context_v1/analyze.py" = ["F401"]
"research/batch_context_v1/run.py" = ["F401"]
"research/domain_expansion_v1/analyze.py" = ["F401"]
"research/domain_expansion_v1/audit_inputs.py" = ["F401"]
"research/model_expansion_v1/freeze.py" = ["F401"]
"research/scifact3_census_v1/analyze.py" = ["F401"]
"research/scifact3_census_v1/audit_inputs.py" = ["F401"]
"research/scifact3_census_v1/compare_prior.py" = ["F401"]
"research/scifact3_census_v1/human_noinfo_audit/validate_packet.py" = ["F401"]
"research/scifact3_v1/audit_inputs.py" = ["F401"]
"research/strong_baseline_v1/freeze.py" = ["F401"]
