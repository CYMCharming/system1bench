name: Verify benchmark artifacts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . ruff
      - run: ruff check system1bench benchmarks research tests
      - run: python -m unittest discover -s tests -v
      - run: python -m research.public_intent_pilot_v1.verify
      - run: python -m research.evaluation_completion_v1.verify
      - run: python -m system1bench.metrics
      - run: python -m system1bench.report
      - run: python benchmarks/verify_hosted_outputs.py
      - run: python research/analyze_confirmation.py
      - run: python research/diagnose_policy.py
      - run: python research/model_expansion_v1/verify.py --check-only --public-only
      - run: python research/model_expansion_replication_v1/verify.py --check-only --public-only
      - run: python research/leaderboard_v1/verify.py
      - run: python research/model_expansion_v2/verify.py --public-only
      - run: python research/leaderboard_v2/verify.py
      - run: python -m research.startlux_transfer_v1.test_protocol
      - run: python research/leaderboard_v3/verify.py
      - run: python benchmarks/performance_report.py --root performance/v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node prepare.mjs && node prepare-review.mjs && node check.mjs && node build.mjs
        working-directory: leaderboard-site
      - run: git diff --exit-code -- results/summary.json results/metrics.csv docs/RESULTS.zh-CN.md README.md
      - run: git diff --exit-code -- performance/v1/summary.json performance/v1/metrics.csv docs/PERFORMANCE_RESULTS.en.md
