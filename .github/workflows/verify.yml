name: Verify benchmark artifacts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . ruff
      - run: ruff check system1bench tests
      - run: python -m unittest discover -s tests -v
      - run: python -m system1bench.metrics
      - run: python -m system1bench.report
      - run: git diff --exit-code -- results/summary.json results/metrics.csv docs/RESULTS.zh-CN.md
